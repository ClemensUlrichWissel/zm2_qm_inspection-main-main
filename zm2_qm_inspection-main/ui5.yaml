specVersion: "3.1"
metadata:
  name: zm2_0001_inslot
type: application
resources:
  configuration:
    paths:
      webapp: webapp
builder:
  customTasks:
    - name: ui5-task-nwabap-deployer
      afterTask: generateVersionInfo
      configuration: 
        resources:
          pattern: "**/*.*"
        connection:
          server: https://gtlhethgdci.ads.hettich.com:44335
        authentication:
          user:
          password:
        ui5:
          language: EN
          package: ZM2_QM
          bspContainer: ZM2_0001_INSLOT
          bspContainerText: Inspection Lot Management
          transportNo: 
          calculateApplicationIndex: true
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: true
        debug: false
        backend:
          - path: /sap
            url: https://gtlhethgddev.ads.hettich.com
            xfwd: true
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.84.55
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
framework:
  name: SAPUI5
  version: "1.84.55"
  libraries:
    - name: sap.f
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.comp
    - name: sap.ushell
    - name: themelib_sap_fiori_3
